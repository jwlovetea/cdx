name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests
        run: npm run check

      - name: Compile and smoke (real DuckDB)
        run: |
          npm run compile
          npm run smoke

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --allow-missing-repository
